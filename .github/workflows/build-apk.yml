name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Set build number (auto)
        run: |
          sed -i "s/version: .*/version: 1.0.${{ github.run_number }}+${{ github.run_number }}/" pubspec.yaml

      - name: Create Android platform
        run: flutter create --platforms android --project-name katalog .

      - name: Add internet permission
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Copy signing key
        run: |
          mkdir -p android/app
          cp android/app/release-key.jks android/app/release-key.jks 2>/dev/null || echo "Key not found, using debug"

      - name: Convert logo to PNG icon
        run: |
          sudo apt-get install -y imagemagick
          convert assets/icon.jpg -resize 1024x1024 assets/icon.png

      - name: Generate app launcher icons
        run: |
          flutter pub add --dev flutter_launcher_icons
          echo "flutter_launcher_icons:" >> pubspec.yaml
          echo "  android: true" >> pubspec.yaml
          echo "  ios: false" >> pubspec.yaml
          echo "  image_path: 'assets/icon.png'" >> pubspec.yaml
          flutter pub run flutter_launcher_icons

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK release (signed)
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_id }}
          path: build/app/outputs/flutter-apk/app-release.apk
